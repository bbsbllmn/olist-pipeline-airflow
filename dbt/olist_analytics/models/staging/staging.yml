version: 2

models:
  - name: stg_orders
    description: One row per order with parsed timestamps for each lifecycle stage.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable',
                        'invoiced', 'processing', 'created', 'approved']

  - name: stg_order_items
    description: One row per item within an order.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: price
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: stg_payments
    description: One row per order per payment method.
    columns:
      - name: order_id
        data_tests: [not_null]

  - name: stg_products
    description: Product catalog with English category names joined in.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_customers
    description: One row per customer_id (order-level customer identifier).
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_sellers
    description: One row per seller.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_reviews
    description: Most recent review per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false
