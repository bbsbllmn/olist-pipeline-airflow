version: 2

sources:
  - name: olist_bronze
    database: "{{ env_var('GCP_PROJECT_ID', target.database) }}"
    schema: "olist_bronze"
    loader: airflow (GCSToBigQueryOperator)
    tables:
      - name: orders
        identifier: orders
      - name: order_items
        identifier: order_items
      - name: order_payments
        identifier: order_payments
      - name: order_reviews
        identifier: order_reviews
      - name: products
        identifier: products
      - name: customers
        identifier: customers
      - name: sellers
        identifier: sellers
      - name: geolocation
        identifier: geolocation
      - name: product_category_translation
        identifier: product_category_translation
